<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Menu - Coffee House</title>

    <link
        rel="icon"
        href="images/logo.svg"
        type="image/svg+xml"
    >

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="header">

		<div class="container header__container">

			<a
				class="logo"
				href="index.html"
			>
				<img
					class="logo__image"
					src="images/logo.svg"
					alt="Coffee House"
				>
			</a>

			<nav class="navigation">

				<ul class="navigation__list">

					<li class="navigation__item">
						<a
							class="navigation__link"
							href="index.html"
						>
							Home
						</a>
					</li>

					<li class="navigation__item">
						<a
							class="navigation__link"
							href="menu.html"
						>
							Menu
						</a>
					</li>

				</ul>

			</nav>

			<div class="header__actions">

				<button
					class="theme-switch"
					type="button"
					aria-label="Switch color theme"
				>
					<span class="theme-switch__item">
						<img
							src="images/Theme switch.svg"
							alt=""
						>
					</span>
				</button>

				<button
					class="burger"
					type="button"
					aria-label="Open navigation menu"
				>
					☰
				</button>

			</div>

		</div>

	</header>

    <main>

        <section>
            <h1>
                Our Menu
			</h1>
        </section>

        <section>
			<h2>
				Categories
			</h2>
        </section>

        <section>
			<h2>
				Coffee Cards
			</h2>
        </section>

    </main>

	<footer class="footer">

		<div class="container">

			<div class="footer__content">

				<div class="footer__contacts">

					<h2>
						Contact us
					</h2>

					<a href="tel:+49123456789">
						+49 123 456789
					</a>

					<a href="mailto:hello@coffeehouse.com">
						hello@coffeehouse.com
					</a>

				</div>

				<div class="footer__social">

					<h2>
						Follow us
					</h2>

					<a
						href="https://github.com/"
						target="_blank"
						rel="noopener noreferrer"
					>
						GitHub
					</a>

				</div>

			</div>

			<p class="footer__copyright">
				© 2026 Coffee House
			</p>

		</div>

	</footer>

    <script src="js/script.js"></script>

</body>

</html>
